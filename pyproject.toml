[project]
name = "local-voice-clone"
version = "0.2.0"
description = "Windows desktop voice cloning with repeatable one-click setup"
requires-python = "==3.12.*"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "runtime", "models", "releases", "tools", "cache"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
